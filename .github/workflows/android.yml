name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: chmod +x gradlew
      - run: ./gradlew test lint assembleDebug --no-daemon
      - run: python3 tools/check_privacy.py --merged
      - uses: actions/upload-artifact@v4
        with:
          name: Container-Track-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-reports
          path: app/build/reports/
  device-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew connectedDebugAndroidTest --no-daemon
            mkdir -p app/build/screenshots
            adb pull /sdcard/Android/data/ch.zerogen.containertrack/files/screenshots/. app/build/screenshots/
      - name: Compare reviewed screenshots when baselines exist
        if: hashFiles('design/goldens/*.png') != ''
        run: |
          python3 -m pip install Pillow==11.3.0
          python3 tools/compare_screenshots.py design/goldens app/build/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-reports-and-screenshots
          path: |
            app/build/reports/androidTests/
            app/build/screenshots/
